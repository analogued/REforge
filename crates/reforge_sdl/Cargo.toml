[package]
name = "reforge_sdl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Shared SDL3 frame presentation for REforge"

[features]
dev-tools = []

[dependencies]
reforge_settings = { path = "../reforge_settings" }
egui = { version = "=0.31.1", default-features = false, features = ["default_fonts"] }
sdl3 = { version = "=0.20.0", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
