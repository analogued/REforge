[workspace]
members = ["app", "engines/alleycat", "engines/mach3", "engines/btz", "engines/centurion", "crates/reforge_sdl", "crates/reforge_audio", "crates/reforge_graphics", "crates/reforge_settings", "crates/reforge_inputs", "crates/reforge_disc", "crates/reforge_cryo_archive", "crates/reforge_hnm", "crates/reforge_quicktime"]
exclude = [
    "third_party/nihav/nihav-core",
    "third_party/nihav/nihav-codec-support",
    "third_party/nihav/nihav-registry",
    "third_party/nihav/nihav-commonfmt",
    "third_party/nihav/nihav-qt",
]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "2026.3.0-dev"
license = "GPL-3.0-or-later"

# Keep interactive debug FM synthesis usable.
[profile.dev.package.nuked-opl3]
opt-level = 3
