[package]
name = "mach3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Verified DOS Mach 3 graphics reconstruction"

[features]
viewer = ["dep:reforge_sdl"]
dev-tools = ["dep:reforge_audio"]

[dependencies]
reforge_sdl = { path = "../../crates/reforge_sdl", optional = true }
reforge_audio = { path = "../../crates/reforge_audio", optional = true }

[[bin]]
name = "mach3-frame"
path = "src/main.rs"

[[bin]]
name = "mach3-viewer"
path = "src/bin/viewer.rs"
required-features = ["viewer"]

[[bin]]
name = "mach3-opening"
path = "src/bin/opening.rs"

[[bin]]
name = "mach3-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "mach3-sound"
path = "src/bin/sound.rs"
required-features = ["dev-tools"]
