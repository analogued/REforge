[package]
name = "alleycat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "An early Alley Cat reconstruction for modern desktop systems"

[features]
default = ["sdl"]
sdl = []
dev-tools = []

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "alley-cat"
path = "src/main.rs"
