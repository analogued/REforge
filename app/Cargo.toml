[package]
name = "reforge"
version.workspace = true
edition = "2024"
rust-version = "1.88"
publish = false
license.workspace = true
description = "REforge game reconstructions for modern desktop systems"

[features]
default = ["sdl"]
sdl = ["alleycat/sdl", "mach3/sdl", "btz/sdl", "dep:reforge_sdl", "dep:unicode-segmentation", "dep:png", "dep:fs2", "dep:getrandom"]
dev-tools = ["alleycat/dev-tools", "mach3/dev-tools", "btz/dev-tools"]

[dependencies]
reforge_settings = { path = "../crates/reforge_settings" }
reforge_sdl = { path = "../crates/reforge_sdl", optional = true }
alleycat = { path = "../engines/alleycat", default-features = false }
mach3 = { path = "../engines/mach3", default-features = false }
btz = { path = "../engines/btz", default-features = false, features = ["frontend"] }
getrandom = { version = "=0.3.4", optional = true }
unicode-segmentation = { version = "=1.12.0", optional = true }

png = { version = "=0.17.16", optional = true }
fs2 = { version = "=0.4.3", optional = true }
blake3 = { version = "=1.8.7", features = ["rayon", "mmap"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
