# Mach 3 instruction checkpoints and original memory interpretation.
# All code/data offsets are relative to the running expanded program segments.
# Supply startup instruction bytes externally with --bind program_signature=HEX.
# Callback runs before each checkpoint instruction; pass 3 precedes body-tail events.
schema = 1

[variables]
identified = 0
active = 0
game_cs = 0
game = -1
frame_seq = 0
input_seq = 0
control_seq = 0
poll_pass = 0
frame_pass = 0
kind = "initial"
input_body = 0
observed_input = 0
input_mask = 0
caller = 0
control_site = "other"
audio_bypass = 0
object_address = 0
position = 0
sprite_base = 0

[[signatures]]
name = "program"
address = "base.cs + 0x044a"
bytes_binding = "program_signature"

[[streams]]
name = "frames"
path = "frames.bin"
format = "binary"
append = true

[[streams]]
name = "frame_index"
path = "frames.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "kind", "palette", "mode"]

[[streams]]
name = "inputs"
path = "inputs.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "mask"]

[[streams]]
name = "raw_inputs"
path = "raw-inputs.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "mask"]

[[streams]]
name = "games"
path = "games.tsv"
format = "tsv"
headers = ["game", "script", "rng_a", "rng_b", "rng_c"]

[[streams]]
name = "ends"
path = "ends.tsv"
format = "tsv"
headers = ["game", "body", "quit"]

[[streams]]
name = "controls"
path = "controls.tsv"
format = "tsv"
headers = ["seq", "game", "body", "site", "f1", "f2", "f3"]

[[streams]]
name = "display"
path = "display.tsv"
format = "tsv"
headers = ["seq", "color_select", "mode_control"]

[[streams]]
name = "registers"
path = "registers.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "kind", "eax", "ebx", "ecx", "edx", "esi", "edi", "ebp", "esp", "flags", "eflags", "cs", "ds", "es", "ss", "fs", "gs", "ip", "eip"]

[[streams]]
name = "state"
path = "state.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "kind", "strip_index", "strip_y", "vertical_origin", "rng_a", "rng_b", "rng_c", "script_index", "script_cursor", "script_delay", "difficulty", "progression", "speed_forward", "speed_primary", "speed_slow", "speed_mode", "distance_hint", "terrain_selector", "primary_count", "enemy_target_lateral", "enemy_target_height", "fuel", "weapon_counter", "pending_score", "score", "player_phase", "player_animation_row", "player_damage", "player_grace", "player_horizon", "player_velocity_lateral", "player_velocity_height", "player_orientation", "player_vertical_band", "player_input", "exit_requested", "exit_flag_word", "lives_requested", "lives_resolved", "marker_requested", "marker_previous", "marker_width", "marker_height", "bar_width", "bar_draw_width", "marker_source_pointer", "marker_source_relative"]

[[streams]]
name = "objects"
path = "objects.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "kind", "slot", "depth", "lateral", "height_world", "extent_depth", "extent_lateral", "extent_height", "active", "activity_byte", "movement", "requested_sprite", "previous_sprite", "source_pointer", "source_relative", "x_bytes", "y", "width_bytes", "height", "phase", "scale", "animation_phase", "variant", "previous_x", "previous_y", "previous_width", "previous_height"]

[[streams]]
name = "order"
path = "draw-order.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "kind", "position", "slot", "offset", "segment"]

[[streams]]
name = "data_segment"
path = "data-segment.bin"
format = "binary"
append = true

[[streams]]
name = "data_index"
path = "data-segment.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "kind", "ds", "length"]

[[streams]]
name = "sprite_pointers"
path = "sprite-pointers.bin"
format = "binary"
append = true

[[streams]]
name = "stack"
path = "stack.bin"
format = "binary"
append = true

[[streams]]
name = "stack_index"
path = "stack.tsv"
format = "tsv"
headers = ["seq", "game", "body", "pass", "kind", "ss", "sp", "address", "length"]

[[action_groups]]
name = "capture_frame"

[[action_groups.actions]]
type = "set"
variable = "sprite_base"
value = "mem16(base.ds + 0x0f7a) + 16 * mem16(base.ds + 0x0f7c)"

[[action_groups.actions]]
type = "memory"
stream = "frames"
address = "0xb8000"
rows = "200"
bytes_per_row = "80"
row_stride = "80"
banks = "2"
bank_stride = "8192"

[[action_groups.actions]]
type = "emit"
stream = "frame_index"
values = ["frame_seq", "game", "mem16(base.ds + 0xb692)", "frame_pass", "kind", "(device.cga_color_select >> 5) & 1", "mem8(0x449)"]

[[action_groups.actions]]
type = "emit"
stream = "display"
values = ["frame_seq", "device.cga_color_select", "device.cga_mode_control"]

[[action_groups.actions]]
type = "emit"
stream = "registers"
values = ["frame_seq", "game", "mem16(base.ds + 0xb692)", "frame_pass", "kind", "reg.eax", "reg.ebx", "reg.ecx", "reg.edx", "reg.esi", "reg.edi", "reg.ebp", "reg.esp", "reg.flags", "reg.eflags", "reg.cs", "reg.ds", "reg.es", "reg.ss", "reg.fs", "reg.gs", "reg.ip", "reg.eip"]

[[action_groups.actions]]
type = "memory"
stream = "stack"
address = "base.ss + reg.sp"
bytes_per_row = "128"

[[action_groups.actions]]
type = "emit"
stream = "stack_index"
values = ["frame_seq", "game", "mem16(base.ds + 0xb692)", "frame_pass", "kind", "reg.ss", "reg.sp", "base.ss + reg.sp", "128"]

