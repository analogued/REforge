[package]
name = "reforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "REforge game reconstructions for modern desktop systems"

[features]
default = ["sdl"]
sdl = ["alleycat/sdl", "mach3/viewer", "dep:reforge_sdl"]
dev-tools = ["alleycat/dev-tools", "mach3/dev-tools"]

[dependencies]
reforge_settings = { path = "../crates/reforge_settings" }
reforge_sdl = { path = "../crates/reforge_sdl", optional = true }
alleycat = { path = "../engines/alleycat", default-features = false }
mach3 = { path = "../engines/mach3", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
