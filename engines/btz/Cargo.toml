[package]
name = "btz"
version.workspace = true
edition = "2024"
rust-version = "1.88"
publish = false
license.workspace = true
description = "Reconstructed BTZ interpreter core"

[features]
frontend = ["dep:libc", "dep:reforge_settings", "dep:reforge_inputs"]
sdl = ["frontend", "dep:reforge_sdl", "dep:reforge_audio", "dep:reforge_graphics"]
dev-tools = ["frontend", "reforge_sdl?/dev-tools"]

[dependencies]
reforge_graphics = { path = "../../crates/reforge_graphics", optional = true }
reforge_inputs = { path = "../../crates/reforge_inputs", optional = true }
reforge_settings = { path = "../../crates/reforge_settings", optional = true }
reforge_sdl = { path = "../../crates/reforge_sdl", optional = true }
reforge_audio = { path = "../../crates/reforge_audio", features = ["blip"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.190", optional = true }
