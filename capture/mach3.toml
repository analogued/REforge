[[events]]
name = "game_start"
ip = "0x044a"
guard = "not identified or reg.cs == game_cs"
signature = "program"

[[events.actions]]
type = "set"
variable = "game"
value = "game + 1"

[[events.actions]]
type = "set"
variable = "identified"
value = "1"

[[events.actions]]
type = "set"
variable = "game_cs"
value = "reg.cs"

[[events.actions]]
type = "set"
variable = "active"
value = "1"

[[events.actions]]
type = "set"
variable = "poll_pass"
value = "0"

[[events.actions]]
type = "set"
variable = "frame_pass"
value = "0"

[[events.actions]]
type = "set"
variable = "kind"
value = "\"initial\""

[[events.actions]]
type = "emit"
stream = "games"
values = ["game", "mem16(base.ds + 0xb6ac)", "mem16(base.ds + 0x17c1)", "mem16(base.ds + 0x184b)", "mem16(base.ds + 0x184d)"]

[[events.actions]]
type = "call"
group = "capture_frame"

[[events]]
name = "game_end"
ip = "0x0452"
guard = "active and reg.cs == game_cs"

[[events.actions]]
type = "emit"
stream = "ends"
values = ["game", "mem16(base.ds + 0xb692)", "mem16(base.ds + 0xb66a)"]

[[events.actions]]
type = "set"
variable = "active"
value = "0"

[[events]]
name = "body_entry"
ip = "0x04c2"
guard = "active and reg.cs == game_cs"

[[events.actions]]
type = "set"
variable = "poll_pass"
value = "0"

[[events]]
name = "input_poll"
ip = "0x228c"
guard = "active and reg.cs == game_cs"

[[events.actions]]
type = "set"
variable = "poll_pass"
value = "poll_pass + 1"

[[events.actions]]
type = "assert"
condition = "poll_pass <= 3"
message = "unexpected gameplay poll cadence"

[[events.actions]]
type = "set"
variable = "input_body"
value = "(mem16(base.ds + 0xb692) + (poll_pass == 1)) & 65535"

[[events.actions]]
type = "set"
variable = "observed_input"
value = "reg.ax"

[[events.actions]]
type = "set"
variable = "input_mask"
value = "observed_input & 31"

[[events.actions]]
type = "emit"
stream = "inputs"
values = ["input_seq", "game", "input_body", "poll_pass", "input_mask"]

[[events.actions]]
type = "emit"
stream = "raw_inputs"
values = ["input_seq", "game", "input_body", "poll_pass", "observed_input"]

[[events.actions]]
type = "set"
variable = "input_seq"
value = "input_seq + 1"

