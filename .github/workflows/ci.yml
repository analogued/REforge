name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  SDL_RENDER_DRIVER: software

jobs:
  linux:
    name: Linux / Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88.0"]
    env:
      RUST_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust and configure build output
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/reforge-target" >> "$GITHUB_ENV"

      - name: Install formatting and lint tools
        if: matrix.toolchain == 'stable'
        run: rustup component add --toolchain stable rustfmt clippy

      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --all -- --check

      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install SDL3
        if: matrix.toolchain == 'stable'
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: "3.4.0"
          pre-release: false
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true
          # Dummy video still uses udev to discover host input devices. CI
          # supplies synthetic input, including SDL virtual controllers.
          cmake-arguments: -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_LIBUDEV=OFF

      - name: Configure SDL3 linker path
        if: matrix.toolchain == 'stable'
        env:
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: echo "LIBRARY_PATH=$SDL_PREFIX/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Test and lint normal builds
        if: matrix.toolchain == 'stable'
        run: |
          cargo +stable test --locked --workspace
          cargo +stable clippy --locked --workspace --all-targets -- -D warnings

      - name: Test and lint builds without default features
        if: matrix.toolchain == 'stable'
        run: |
          cargo +stable test --locked --workspace --no-default-features
          cargo +stable clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Test and lint development builds
        if: matrix.toolchain == 'stable'
        run: |
          cargo +stable test --locked --workspace --features dev-tools
          cargo +stable clippy --locked --workspace --all-targets --features dev-tools -- -D warnings

      - name: Test and lint development builds without default features
        if: matrix.toolchain == 'stable'
        run: |
          cargo +stable test --locked --workspace --no-default-features --features dev-tools
          cargo +stable clippy --locked --workspace --all-targets --no-default-features --features dev-tools -- -D warnings

      - name: Test software UI rendering and navigation
        if: matrix.toolchain == 'stable'
        run: |
          cargo +stable test --locked -p reforge --features dev-tools launcher::tests::native_painter_capture_matrix_and_modal_navigation -- --exact --ignored --test-threads=1
          cargo +stable test --locked -p reforge --features dev-tools launcher::tests::btz_presentation_controls_native_painter -- --exact --ignored --test-threads=1
          cargo +stable test --locked -p reforge --features dev-tools launcher::tests::filter_activates_native_text_input_and_preserves_caret_navigation -- --exact --ignored --test-threads=1
          cargo +stable test --locked -p reforge_sdl settings::tests::temporary_settings_explain_storage_and_disable_startup_only_edits -- --exact --ignored --test-threads=1
          cargo +stable test --locked -p reforge_sdl settings::tests::alleycat_controls_scope_draft_and_live_apply -- --exact --ignored --test-threads=1
          cargo +stable test --locked -p reforge_sdl settings_ui::controller::captures::native_controller_templates_and_themes -- --exact --ignored --test-threads=1

      - name: Check minimum supported Rust
        if: matrix.toolchain == '1.88.0'
        run: cargo +1.88.0 check --locked --workspace --all-targets --all-features

  windows:
    name: Windows / Rust stable
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust and configure build output
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'reforge-target')" >> $env:GITHUB_ENV

      - name: Cache Cargo downloads and notice generator
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-about.exe
          key: cargo-${{ runner.os }}-${{ runner.arch }}-about-0.9.2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-about-0.9.2-

      - name: Install SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: "3.4.0"
          pre-release: false
          build-type: Release
          cmake-generator: Visual Studio 17 2022
          cmake-arguments: -A x64 -DSDL_SHARED=ON -DSDL_STATIC=OFF
          add-to-environment: true

      - name: Configure SDL3 linker path
        env:
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          $sdlLib = Join-Path $env:SDL_PREFIX 'lib'
          if (!(Test-Path -LiteralPath (Join-Path $sdlLib 'SDL3.lib'))) {
            throw "SDL3 x64 MSVC import library is missing"
          }
          # Encoded arguments preserve spaces without replacing MSVC's LIB paths.
          "CARGO_ENCODED_RUSTFLAGS=-L$([char]0x1f)native=$sdlLib" >> $env:GITHUB_ENV

      - name: Test normal builds
        run: cargo test --locked --workspace

      - name: Lint all targets and features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test software settings and launcher navigation
        run: |
          cargo test --locked -p reforge_sdl settings::tests::alleycat_controls_scope_draft_and_live_apply -- --exact --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p reforge launcher::tests::native_painter_capture_matrix_and_modal_navigation -- --exact --ignored --test-threads=1

      - name: Build release player
        run: cargo build --locked --release -p reforge --bin reforge

      - name: Install notice generator
        run: |
          $about = Get-Command cargo-about -ErrorAction SilentlyContinue
          if (!$about -or (& $about.Source --version) -ne 'cargo-about 0.9.2') {
            cargo install cargo-about --version 0.9.2 --locked --features cli --force
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo about --version

      - name: Generate dependency notices
        run: python tools/package_release.py --notices-only --target x86_64-pc-windows-msvc --output-dir "$env:RUNNER_TEMP/reforge-windows-x86_64"

      - name: Assemble and smoke-test Windows artifact
        env:
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'reforge-windows-x86_64'
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/reforge.exe') -Destination $bundle
          Copy-Item -LiteralPath (Join-Path $env:SDL_PREFIX 'bin/SDL3.dll') -Destination $bundle
          Copy-Item -LiteralPath (Join-Path $env:SDL_PREFIX 'licenses/SDL3/LICENSE.txt') -Destination (Join-Path $bundle 'SDL3-LICENSE.txt')
          Copy-Item -LiteralPath LICENSE -Destination $bundle
          $notices = @(Get-ChildItem -Path "$bundle/THIRD_PARTY-*.html")
          if ($notices.Count -ne 1) { throw "Expected one generated dependency-notices document" }
          Rename-Item -LiteralPath $notices[0].FullName -NewName 'THIRD_PARTY.html'
          @"
          REforge Windows x64 CI test build (not a signed release).
          Commit: $env:GITHUB_SHA
          Source: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/archive/$env:GITHUB_SHA.zip
          Includes SDL 3.4.0. Keep SDL3.dll beside reforge.exe.
          Requires the Microsoft Visual C++ x64 runtime.
          Original game files are required and are not included.
          "@ | Set-Content -LiteralPath (Join-Path $bundle 'BUILD.txt') -Encoding utf8
          # Exercise DLL loading from the bundle rather than the SDK's PATH entry.
          $sdkBin = (Join-Path $env:SDL_PREFIX 'bin').TrimEnd('\', '/')
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_.TrimEnd('\', '/') -ine $sdkBin }) -join ';'
          & (Join-Path $bundle 'reforge.exe') --version

      - name: Upload Windows test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reforge-windows-x86_64
          path: ${{ runner.temp }}/reforge-windows-x86_64/
          if-no-files-found: error
          retention-days: 7
