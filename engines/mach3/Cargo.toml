[package]
name = "mach3"
version.workspace = true
edition = "2024"
rust-version = "1.88"
publish = false
license.workspace = true
description = "Reconstructed DOS Mach 3 engine"

[features]
default = ["sdl"]
sdl = ["dep:reforge_sdl", "reforge_audio/blip"]
dev-tools = ["reforge_audio/blip", "reforge_sdl?/dev-tools"]

[dependencies]
reforge_sdl = { path = "../../crates/reforge_sdl", optional = true }
reforge_audio = { path = "../../crates/reforge_audio" }

[[bin]]
name = "mach3-frame"
path = "src/main.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mach-3"
path = "src/bin/mach-3.rs"
required-features = ["sdl"]

[[bin]]
name = "mach3-opening"
path = "src/bin/opening.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mach3-replay"
path = "src/bin/replay.rs"
required-features = ["dev-tools"]

[[bin]]
name = "mach3-sound"
path = "src/bin/sound.rs"
required-features = ["dev-tools"]

[[test]]
name = "frame_cli"
path = "tests/frame_cli.rs"
required-features = ["dev-tools"]
