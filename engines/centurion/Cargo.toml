[package]
name = "centurion"
version.workspace = true
edition = "2024"
rust-version = "1.88"
publish = false
license.workspace = true
description = "Centurion: Defender of Rome DOS engine and research frontend"

[features]
default = ["sdl"]
sdl = ["dep:sdl3", "dep:reforge_sdl"]
dev-tools = ["reforge_sdl?/dev-tools"]

[dependencies]
sdl3 = { version = "=0.20.0", default-features = false, optional = true }
reforge_sdl = { path = "../../crates/reforge_sdl", optional = true }
reforge_inputs = { path = "../../crates/reforge_inputs" }
reforge_settings = { path = "../../crates/reforge_settings" }
reforge_audio = { path = "../../crates/reforge_audio", default-features = false, features = ["opl"] }

[[bin]]
name = "centurion-prototype"
path = "src/main.rs"
