[[action_groups.actions]]
type = "memory"
stream = "sprite_pointers"
address = "sprite_base"
rows = "1"
bytes_per_row = "760"
guard = "frame_seq == 0"

[[action_groups.actions]]
type = "memory"
stream = "data_segment"
address = "base.ds"
rows = "1"
bytes_per_row = "65536"
guard = "kind == \"initial\" or (kind == \"gameplay\" and frame_pass == 3)"

[[action_groups.actions]]
type = "emit"
stream = "data_index"
values = ["frame_seq", "game", "mem16(base.ds + 0xb692)", "frame_pass", "kind", "reg.ds", "65536"]
guard = "kind == \"initial\" or (kind == \"gameplay\" and frame_pass == 3)"

