[package]
name = "alleycat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Alley Cat reconstruction for modern desktop systems"

[features]
default = ["sdl"]
sdl = ["dep:reforge_sdl", "dep:reforge_audio", "reforge_audio/blip"]
dev-tools = ["dep:reforge_audio", "reforge_audio/blip", "reforge_sdl?/dev-tools"]

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }
reforge_audio = { path = "../../crates/reforge_audio", optional = true }
reforge_sdl = { path = "../../crates/reforge_sdl", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "alley-cat"
path = "src/main.rs"
